# Sets the Gradle daemon JVM max heap size to 4GB and the file encoding to UTF-8.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of the legacy Support Library.
android.useAndroidX=true

# Apply the official Kotlin code style.
kotlin.code.style=official

# Each module's R class contains only resources declared in that module, improving build performance.
android.nonTransitiveRClass=true

# Disables enforcement of unique package names across modules (allows duplicate package names).
android.uniquePackageNames=false

# Disables strict interpretation of keep rules in R8 full mode, keeping compatibility with existing keep rules.
android.r8.strictFullModeForKeepRules=false

# Enables the build cache to skip re-executing tasks whose inputs have not changed.
org.gradle.caching=true

# Caches the configuration phase (task graph creation) to speed up build startup.
org.gradle.configuration-cache=true

# Stores and loads the configuration cache entries in parallel.
org.gradle.configuration-cache.parallel=true

# Executes tasks of decoupled modules in parallel.
org.gradle.parallel=true

# Sets the Kotlin compile daemon max heap size to 2GB.
kotlin.daemon.jvmargs=-Xmx2048m

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Base URL — core BuildConfig.BASE_URL 로 주입 (toml isRealServer: true → Production, false → Development)
baseUrlDevelopment = https://api.unsplash.com/
baseUrlProduction  = https://api.unsplash.com/