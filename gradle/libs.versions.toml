[versions]

# Android
compileSdk                              = "37"
minSdk                                  = "26"
targetSdk                               = "37"
versionCode                             = "1"
versionName                             = "1.0.0"
isRealServer                            = "false" # true or false

# Plugins
agp                                     = "9.4.1"
kotlin                                  = "2.4.20"
ksp                                     = "2.3.11"
google-services                         = "4.5.0"
firebase-crashlytics-plugin             = "3.0.8"

# AndroidX
androidx-core                           = "1.19.1"
androidx-core-splashscreen              = "1.2.0"
androidx-activity                       = "1.13.0"
androidx-lifecycle                      = "2.11.0"
androidx-navigation                     = "2.10.2"

# Baseline Profile (androidx.baselineprofile 플러그인)
benchmark                               = "1.5.0"

# Compose
compose-bom                             = "2026.09.00"

# Coroutines
kotlinx-coroutines                      = "1.11.0"

# DI
koin                                    = "4.2.2"

# Retrofit & OkHttp
retrofit                                = "3.0.0"
okhttp                                  = "5.5.0"

# Moshi
moshi                                   = "1.15.2"

# Paging
paging                                  = "3.5.3"

# Room
room                                    = "2.8.5"

# Firebase
firebase-bom                            = "35.0.0"

# Tools
timber                                  = "5.0.1"
coil                                    = "3.6.3"

# Test
junit                                   = "4.13.2"
androidx-junit                          = "1.3.0"
androidx-espresso-core                  = "3.7.0"
turbine                                 = "1.2.1"
mockk                                   = "1.14.5"
robolectric                             = "4.16"

[libraries]

# AndroidX
androidx-core-ktx                       = { module = "androidx.core:core-ktx",                              version.ref = "androidx-core" }
androidx-core-splashscreen              = { module = "androidx.core:core-splashscreen",                     version.ref = "androidx-core-splashscreen" }
androidx-lifecycle-runtime-ktx          = { module = "androidx.lifecycle:lifecycle-runtime-ktx",            version.ref = "androidx-lifecycle" }

# Compose (버전은 BOM 이 관리)
androidx-compose-bom                    = { module = "androidx.compose:compose-bom",                        version.ref = "compose-bom" }
androidx-compose-ui                     = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics            = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling             = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview     = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3              = { module = "androidx.compose.material3:material3" }
androidx-activity-compose               = { module = "androidx.activity:activity-compose",                  version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose      = { module = "androidx.lifecycle:lifecycle-runtime-compose",        version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose    = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",      version.ref = "androidx-lifecycle" }
androidx-navigation-compose             = { module = "androidx.navigation:navigation-compose",              version.ref = "androidx-navigation" }

# Coroutines
kotlinx-coroutines-android              = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",    version.ref = "kotlinx-coroutines" }

# DI
koin-android                            = { module = "io.insert-koin:koin-android",                         version.ref = "koin" }
koin-androidx-compose                   = { module = "io.insert-koin:koin-androidx-compose",                version.ref = "koin" }

# Retrofit & OkHttp
retrofit-core                           = { module = "com.squareup.retrofit2:retrofit",                     version.ref = "retrofit" }
retrofit-converter-moshi                = { module = "com.squareup.retrofit2:converter-moshi",              version.ref = "retrofit" }
okhttp                                  = { module = "com.squareup.okhttp3:okhttp",                         version.ref = "okhttp" }
okhttp-logging-interceptor              = { module = "com.squareup.okhttp3:logging-interceptor",            version.ref = "okhttp" }

# Moshi
moshi                                   = { module = "com.squareup.moshi:moshi",                            version.ref = "moshi" }
moshi-kotlin-codegen                    = { module = "com.squareup.moshi:moshi-kotlin-codegen",             version.ref = "moshi" }

# Paging (paging-common: PagingSource·PagingData / paging-compose: LazyPagingItems)
paging-common                           = { module = "androidx.paging:paging-common",                       version.ref = "paging" }
paging-compose                          = { module = "androidx.paging:paging-compose",                      version.ref = "paging" }

# Room (room-compiler 는 ksp 로 별도 선언)
room-runtime                            = { module = "androidx.room:room-runtime",                          version.ref = "room" }
room-compiler                           = { module = "androidx.room:room-compiler",                         version.ref = "room" }

# Firebase (BoM 사용 — 개별 버전 명시 없음)
firebase-bom                            = { module = "com.google.firebase:firebase-bom",                    version.ref = "firebase-bom" }
firebase-messaging                      = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics                    = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics                      = { module = "com.google.firebase:firebase-analytics" }

# Tools
timber                                  = { module = "com.jakewharton.timber:timber",                       version.ref = "timber" }
coil-compose                            = { module = "io.coil-kt.coil3:coil-compose",                       version.ref = "coil" }
coil-network-okhttp                     = { module = "io.coil-kt.coil3:coil-network-okhttp",                version.ref = "coil" }

# Test
junit                                   = { module = "junit:junit",                                         version.ref = "junit" }
androidx-junit                          = { module = "androidx.test.ext:junit",                             version.ref = "androidx-junit" }
androidx-espresso-core                  = { module = "androidx.test.espresso:espresso-core",                version.ref = "androidx-espresso-core" }
kotlinx-coroutines-test                 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",       version.ref = "kotlinx-coroutines" }
turbine                                 = { module = "app.cash.turbine:turbine",                            version.ref = "turbine" }
mockk                                   = { module = "io.mockk:mockk",                                      version.ref = "mockk" }
okhttp-mockwebserver                    = { module = "com.squareup.okhttp3:mockwebserver",                  version.ref = "okhttp" }
robolectric                             = { module = "org.robolectric:robolectric",                         version.ref = "robolectric" }

[plugins]

android-application                     = { id = "com.android.application",                                 version.ref = "agp" }
android-library                         = { id = "com.android.library",                                     version.ref = "agp" }
kotlin-compose                          = { id = "org.jetbrains.kotlin.plugin.compose",                     version.ref = "kotlin" }
kotlin-serialization                    = { id = "org.jetbrains.kotlin.plugin.serialization",               version.ref = "kotlin" }
ksp                                     = { id = "com.google.devtools.ksp",                                 version.ref = "ksp" }
google-services                         = { id = "com.google.gms.google-services",                          version.ref = "google-services" }
firebase-crashlytics                    = { id = "com.google.firebase.crashlytics",                         version.ref = "firebase-crashlytics-plugin" }
baselineprofile                         = { id = "androidx.baselineprofile",                                version.ref = "benchmark" }
room                                    = { id = "androidx.room",                                           version.ref = "room" }

[bundles]

# App 모듈 전용
app-dependencies                        = [
    "koin-android",
    "timber",
    "androidx-core-ktx",
    "androidx-lifecycle-runtime-ktx",
]

# Core 모듈 전용
core-dependencies                       = [
    "androidx-core-ktx",
    "timber",
    "kotlinx-coroutines-android",
    "moshi",
    "retrofit-core",
    "retrofit-converter-moshi",
    "okhttp",
    "okhttp-logging-interceptor",
]

# DI 모듈 전용
di-dependencies                         = [
    "koin-android",
    "room-runtime",
    "retrofit-core",
    "okhttp",
]

# Domain 모듈 전용
domain-dependencies                     = [
    "paging-common",
    "timber",
    "kotlinx-coroutines-android",
    "moshi",
]

# Data 모듈 전용
data-dependencies                       = [
    "paging-common",
    "retrofit-core",
    "okhttp",
    "room-runtime",
    "kotlinx-coroutines-android",
]

# Compose
compose                                 = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-activity-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-navigation-compose",
    "koin-androidx-compose",
    "androidx-core-splashscreen",
    "paging-compose",
    "coil-compose",
    "coil-network-okhttp",
]

# Firebase
firebase                                = [
    "firebase-messaging",
    "firebase-crashlytics",
    "firebase-analytics",
]
